name: QA

# GitHub Pages publie sur push, indépendamment de ce workflow : sur un push
# direct vers main, cette action n'empêche rien, elle alerte après coup.
#
# C'est pourquoi le travail passe par une pull request. La vérification s'y
# exécute AVANT la fusion, et comme c'est la fusion qui publie, un échec arrête
# la mise en ligne. Le README décrit la marche à suivre.
#
# Pour rendre la règle contraignante plutôt que volontaire : Settings → Rules →
# protéger main en exigeant le contrôle « Non-régression ». Le déploiement
# piloté par workflow (actions/deploy-pages) donnerait le même résultat, au prix
# d'une infrastructure que ce site vitrine ne justifie pas.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un push qui en suit un autre annule la vérification devenue obsolète.
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Non-régression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Le navigateur pèse ~115 Mo : sans ce cache, chaque exécution
      # le retélécharge et le workflow prend deux fois plus de temps.
      - name: Cache du navigateur Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # postinstall lance « playwright install chromium ». La commande est
      # idempotente : si le cache a restauré le navigateur, elle le constate
      # et rend la main aussitôt. On ne cherche donc pas à la court-circuiter,
      # ce qui laisserait le workflow sans navigateur si le cache était partiel.
      - name: Installer les dépendances
        run: npm ci

      - name: Dépendances système du navigateur
        run: npx playwright install-deps chromium

      # Les regles de reservation sont des fonctions pures : elles se testent
      # sans navigateur, en une seconde, et rien ne sert de lancer le reste
      # si elles sont cassees.
      - name: Tester les règles de réservation
        run: npm test

      - name: Vérifier le site
        run: npm run qa

      - name: Que faire en cas d'échec
        if: failure()
        run: |
          echo "### Une fonctionnalité du site est cassée" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ici la QA ne compare pas l'apparence, seulement le **comportement** :" >> $GITHUB_STEP_SUMMARY
          echo "menu, accordéon, filtres, recherche, carte, calendrier, anonymat des avis." >> $GITHUB_STEP_SUMMARY
          echo "Un échec signifie donc qu'une fonction ne répond plus, pas qu'un pixel a bougé." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Rien n'est en ligne : cette vérification précède la fusion." >> $GITHUB_STEP_SUMMARY
            echo "Corrigez sur la branche, la publication attendra." >> $GITHUB_STEP_SUMMARY
          else
            echo "Le site est **déjà en ligne** : GitHub Pages publie sur push," >> $GITHUB_STEP_SUMMARY
            echo "sans attendre ce workflow. Vérifiez la production." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pour reproduire en local :" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo 'npm run qa' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
