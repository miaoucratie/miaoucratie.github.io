name: QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      regenerer_empreinte:
        description: "Régénérer l'empreinte et la publier en artefact"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Non-régression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Cache du navigateur
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Installer les dépendances
        run: npm ci

      - name: Dépendances système du navigateur
        run: npx playwright install-deps chromium

      - name: Tests
        run: npm test

      - name: Comportement
        run: npm run qa

      - name: Contrôles
        run: npm run controles:base

      - name: Mise en page
        run: npm run mise-en-page:strict

      - name: Articles
        run: npm run articles

      - name: Résumé
        if: failure()
        run: echo "### Échec" >> $GITHUB_STEP_SUMMARY

  empreinte:
    name: Empreinte visuelle
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble-arm64@sha256:941cc91e5022880ac1d14ae90b476b624deb6399dbbc28d612d5d5bd7928fcbd

    steps:
      - uses: actions/checkout@v4

      - name: Installer les dépendances
        run: npm ci

      - name: Comparer
        if: ${{ inputs.regenerer_empreinte != true }}
        run: npm run qa:empreinte

      - name: Régénérer
        if: ${{ inputs.regenerer_empreinte == true }}
        run: npm run qa:update

      - name: Publier le relevé régénéré
        if: ${{ inputs.regenerer_empreinte == true }}
        uses: actions/upload-artifact@v4
        with:
          name: reference
          path: qa/reference.json
          retention-days: 7
