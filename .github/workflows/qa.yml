name: QA

# GitHub Pages publie sur push, indépendamment de ce workflow : sur un push
# direct vers main, cette action n'empêche rien, elle alerte après coup.
#
# C'est pourquoi le travail passe par une pull request. La vérification s'y
# exécute AVANT la fusion, et comme c'est la fusion qui publie, un échec arrête
# la mise en ligne. Le README décrit la marche à suivre.
#
# Pour rendre la règle contraignante plutôt que volontaire : Settings → Rules →
# protéger main en exigeant le contrôle « Non-régression ». Le déploiement
# piloté par workflow (actions/deploy-pages) donnerait le même résultat, au prix
# d'une infrastructure que ce site vitrine ne justifie pas.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un push qui en suit un autre annule la vérification devenue obsolète.
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Non-régression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # L'historique complet, et non le seul dernier commit : l'etape qui
      # compare l'apparence a besoin de reconstruire l'arbre de la base de la
      # pull request. Le depot pese quelques mega-octets, la difference de
      # duree ne se mesure pas.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Le navigateur pèse ~115 Mo : sans ce cache, chaque exécution
      # le retélécharge et le workflow prend deux fois plus de temps.
      - name: Cache du navigateur Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # postinstall lance « playwright install chromium ». La commande est
      # idempotente : si le cache a restauré le navigateur, elle le constate
      # et rend la main aussitôt. On ne cherche donc pas à la court-circuiter,
      # ce qui laisserait le workflow sans navigateur si le cache était partiel.
      - name: Installer les dépendances
        run: npm ci

      - name: Dépendances système du navigateur
        run: npx playwright install-deps chromium

      # Les regles de reservation sont des fonctions pures : elles se testent
      # sans navigateur, en une seconde, et rien ne sert de lancer le reste
      # si elles sont cassees.
      - name: Tester les règles de réservation
        run: npm test

      - name: Vérifier le site
        run: npm run qa

      # L'empreinte visuelle ne traverse pas la frontiere entre systemes : le
      # fichier « qa/reference.json » est produit sous Windows, la CI tourne
      # sous Ubuntu, et la meme page y rend des largeurs de texte differentes
      # de 2 a 3 %. L'etape ci-dessus renonce donc a comparer l'apparence.
      #
      # Consequence, constatee le 31 aout : le texte d'affiliation de deux
      # pages a change, la reference est restee sur l'ancien, et la CI est
      # restee verte. Rien n'aurait signale une page qui se decompose.
      #
      # On mesure donc la BASE de la pull request et la pull request dans la
      # meme execution, sur la meme machine : les deux relevés redeviennent
      # comparables, et l'ecart est exactement ce que la pull request change.
      # Rien n'entre dans le depot, l'empreinte de la base vit le temps du job.
      #
      # Une page ajoutee ou renommee produit une vue sans equivalent en face :
      # elle est nommee, elle n'echoue pas.
      - name: Comparer l'apparence avec la base
        if: github.event_name == 'pull_request'
        run: |
          git worktree add ../base ${{ github.event.pull_request.base.sha }}
          QA_RACINE="$PWD/../base" node qa/qa.mjs --update --reference "$RUNNER_TEMP/base.json"
          node qa/qa.mjs --reference "$RUNNER_TEMP/base.json" --detail

      # Les controles arrives avec le blog ne tournaient que sur le poste
      # d'Irina : la CI ne lancait que « npm test » et « npm run qa ». Une page
      # pouvait donc partir en ligne sans title, sans canonical, ou absente du
      # sitemap, sans que rien ne l'arrete. Ceux qui passent aujourd'hui sur
      # l'ensemble du site deviennent bloquants ici. Ils lisent le dossier ou
      # le registre des articles, jamais une liste recopiee : une page ajoutee
      # demain y entre d'elle-meme.
      - name: Contrôler le SEO, la rédaction, les espacements et les feuilles
        run: |
          npm run blog:check
          npm run seo:strict
          npm run redaction:strict
          npm run espacements:strict
          npm run css

      # Ces deux-la relevent des defauts reels, mais anterieurs au blog :
      # 43 constats de mise en page — contraste, boutons casses, reperes
      # <main>, <nav> et <header> absents — et une divergence entre les deux
      # articles. Les rendre bloquants arreterait toute pull request tant que
      # ces defauts ne sont pas traites. Ils tournent donc pour le releve, et
      # le journal du job garde la trace de ce qui reste.
      - name: Relever la mise en page et comparer les articles
        run: |
          npm run mise-en-page
          npm run articles

      - name: Que faire en cas d'échec
        if: failure()
        run: |
          echo "### Une vérification n'est pas passée" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deux familles de contrôles peuvent arrêter ce job." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Vérifier le site.** La QA ne compare pas l'apparence, seulement le" >> $GITHUB_STEP_SUMMARY
          echo "**comportement** : menu, accordéon, filtres, recherche, carte, calendrier," >> $GITHUB_STEP_SUMMARY
          echo "anonymat des avis. Un échec signifie qu'une fonction ne répond plus," >> $GITHUB_STEP_SUMMARY
          echo "pas qu'un pixel a bougé." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Contrôler le SEO, la rédaction, les espacements et les feuilles.** Une" >> $GITHUB_STEP_SUMMARY
          echo "page a perdu une balise, une formulation interdite est revenue, un bloc" >> $GITHUB_STEP_SUMMARY
          echo "s'est décollé, ou le registre du blog ne correspond plus aux pages." >> $GITHUB_STEP_SUMMARY
          echo "Le journal du job nomme le fichier et la règle." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Comparer l'apparence avec la base.** Une page ne rend plus la même" >> $GITHUB_STEP_SUMMARY
          echo "chose qu'avant cette branche. Le journal donne la vue, l'élément et les" >> $GITHUB_STEP_SUMMARY
          echo "deux valeurs. Si l'écart est voulu, regardez la page rendue puis lancez" >> $GITHUB_STEP_SUMMARY
          echo "\`npm run qa:update\` en local pour aligner la référence." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Rien n'est en ligne : cette vérification précède la fusion." >> $GITHUB_STEP_SUMMARY
            echo "Corrigez sur la branche, la publication attendra." >> $GITHUB_STEP_SUMMARY
          else
            echo "Le site est **déjà en ligne** : GitHub Pages publie sur push," >> $GITHUB_STEP_SUMMARY
            echo "sans attendre ce workflow. Vérifiez la production." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pour reproduire en local :" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo 'npm run qa' >> $GITHUB_STEP_SUMMARY
          echo 'npm run blog:check && npm run seo:strict && npm run redaction:strict && npm run espacements:strict && npm run css' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
